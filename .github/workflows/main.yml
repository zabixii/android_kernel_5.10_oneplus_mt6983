name: Build LineageOS Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    env:
      KERNEL_REPO: https://github.com/lineageos-on-vitamin/android_kernel_oneplus_mt6983.git
      KERNEL_DEFCONFIG: k6893v1_64_defconfig
      OUT_DIR: out
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:
      - name: Checkout Kernel Repo
        uses: actions/checkout@v3
        with:
          repository: ${{ env.KERNEL_REPO }}
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio flex libssl-dev libncurses5-dev \
            libelf-dev dwarves gcc-aarch64-linux-gnu

      - name: Create Output Directory
        run: mkdir -p $OUT_DIR

      - name: Set up Environment
        run: |
          export ARCH=$ARCH
          export CROSS_COMPILE=$CROSS_COMPILE

      - name: Build Kernel
        run: |
          make O=$OUT_DIR $KERNEL_DEFCONFIG
          make -j$(nproc) O=$OUT_DIR

      - name: Package Kernel
        run: |
          cd $OUT_DIR
          tar czf kernel-build.tar.gz *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lineageos-kernel
          path: $OUT_DIR/kernel-build.tar.gz
