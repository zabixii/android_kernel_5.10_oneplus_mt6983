name: Build MTK Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      OUT_DIR: out
      KERNEL_ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Install dependencies
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex libncurses5-dev libssl-dev ccache \
                              u-boot-tools git wget curl zip unzip aarch64-linux-gnu

      # 3. Prepare output directory
      - name: Prepare build directory
        run: mkdir -p $OUT_DIR

      # 4. Copy device config
      - name: Use device config
        run: cp config $OUT_DIR/.config

      # 5. Run olddefconfig to fix missing options
      - name: Prepare kernel
        run: make O=$OUT_DIR olddefconfig ARCH=$KERNEL_ARCH CROSS_COMPILE=$CROSS_COMPILE

      # 6. Build kernel
      - name: Build kernel
        run: make -j$(nproc) O=$OUT_DIR ARCH=$KERNEL_ARCH CROSS_COMPILE=$CROSS_COMPILE

      # 7. Package the kernel
      - name: Package kernel
        run: |
          mkdir -p out/kernel
          cp $OUT_DIR/arch/arm64/boot/Image.gz-dtb out/kernel/
          cd out && tar -czvf kernel-build.tar.gz kernel

      # 8. Upload artifact
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: out/kernel-build.tar.gz
