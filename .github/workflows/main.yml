name: Build MTK Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KERNEL_DEFCONFIG: k6893v1_64_k510_defconfig
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      OUT_DIR: out

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio flex libssl-dev libncurses5-dev \
            wget git curl

      - name: Check cross compiler
        run: |
          if ! command -v aarch64-linux-gnu-gcc >/dev/null; then
            echo "Installing cross compiler..."
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi
          aarch64-linux-gnu-gcc --version

      - name: Ensure defconfig exists
        run: |
          if [ ! -f arch/arm64/configs/$KERNEL_DEFCONFIG ]; then
            echo "$KERNEL_DEFCONFIG not found in arch/arm64/configs!"
            exit 1
          fi

      - name: Generate .config
        run: |
          make O=$OUT_DIR ARCH=$ARCH $KERNEL_DEFCONFIG

      - name: Try building kernel
        run: |
          make -j$(nproc) O=$OUT_DIR ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE || echo "Build failed, but workflow completed."

      - name: Output artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: kernel-build-output
          path: ${{ env.OUT_DIR }}
