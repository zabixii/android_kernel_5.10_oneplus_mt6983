name: Build LineageOS Kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  KERNEL_REPO: lineageos-on-vitamin/android_kernel_oneplus_mt6983
  KERNEL_DEFCONFIG: k6893v1_64_defconfig
  OUT_DIR: out

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout LineageOS Kernel
        uses: actions/checkout@v3
        with:
          repository: ${{ env.KERNEL_REPO }}
          fetch-depth: 1

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex cpio libssl-dev libncurses5-dev

      - name: Install AArch64 cross-compiler
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Create output directory
        run: mkdir -p $OUT_DIR

      - name: Configure kernel
        run: make O=$OUT_DIR $KERNEL_DEFCONFIG ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-

      - name: Build kernel
        run: make -j$(nproc) O=$OUT_DIR ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-

      - name: Package kernel
        run: |
          mkdir -p $OUT_DIR/zip
          cp $OUT_DIR/arch/arm64/boot/Image.gz-dtb $OUT_DIR/zip/
          cd $OUT_DIR/zip
          tar -czvf kernel-build.tar.gz *

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: $OUT_DIR/zip/kernel-build.tar.gz
