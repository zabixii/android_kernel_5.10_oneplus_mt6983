name: Build MTK Kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    env:
      OUT_DIR: out
      KERNEL_DEFCONFIG: config    # Your uploaded config file in repo root
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential bc bison flex libncurses5-dev \
            libssl-dev ccache u-boot-tools git wget curl zip unzip \
            gcc-aarch64-linux-gnu

      - name: Prepare build
        run: |
          mkdir -p $OUT_DIR
          cp $KERNEL_DEFCONFIG $OUT_DIR/.config

      - name: Build kernel
        run: |
          make O=$OUT_DIR ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE oldconfig
          make -j$(nproc) O=$OUT_DIR ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE

      - name: List artifacts
        run: |
          ls -l $OUT_DIR/arch/arm64/boot

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: $OUT_DIR/arch/arm64/boot/Image.gz-dtb
