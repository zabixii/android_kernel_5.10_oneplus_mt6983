name: Build MTK Kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  KERNEL_DEFCONFIG: k6893v1_64_k510_defconfig
  CROSS_COMPILE: aarch64-linux-gnu-
  OUT_DIR: out

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex cpio libssl-dev libncurses5-dev \
            git wget curl zip unzip

      - name: Set up cross-compiler
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Prepare kernel output directory
        run: mkdir -p $OUT_DIR

      - name: Load kernel config
        run: make O=$OUT_DIR $KERNEL_DEFCONFIG

      - name: Build kernel
        run: make -j$(nproc) O=$OUT_DIR

      - name: Package kernel
        run: |
          cd $OUT_DIR
          tar czf kernel-build.tar.gz *

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-output
          path: ${{ env.OUT_DIR }}/kernel-build.tar.gz
