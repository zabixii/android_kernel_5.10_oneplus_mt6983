name: Build MTK Kernel with CPU Scheduler Fix

on:
  push:
    branches:
      - main
      - 'feature/*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KERNEL_DEFCONFIG: k6893v1_64_k510_defconfig
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libncurses5-dev libssl-dev bc cpio

      - name: Set Defconfig
        run: |
          make O=out $KERNEL_DEFCONFIG

      - name: Apply MTK CPU Scheduler Fix
        run: |
          SCHED_MK="drivers/misc/mediatek/sched/Makefile"
          if [ -f "$SCHED_MK" ]; then
            sed -i '/subdir-ccflags-y/ s|$| -I$(srctree)/drivers/misc/mediatek/sched/|' $SCHED_MK
          fi

      - name: Build Kernel
        run: |
          make -j$(nproc) O=out

      - name: Package Kernel (Optional)
        run: |
          tar -czf out/kernel-build.tar.gz -C out .
