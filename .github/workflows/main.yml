name: Build LineageOS Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OUT_DIR: out
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      DEFCONFIG: k6893v1_64_defconfig   # replace with your device defconfig if different

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Checkout device tree
        uses: actions/checkout@v3
        with:
          repository: lineageos-on-vitamin/android_device_oneplus_vitamin-kernel
          path: device

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev make cpio libncurses5-dev gcc-aarch64-linux-gnu

      - name: Prepare output directory
        run: mkdir -p $OUT_DIR

      - name: Setup defconfig
        run: make O=$OUT_DIR $DEFCONFIG

      - name: Build kernel
        run: make O=$OUT_DIR -j$(nproc)

      - name: Upload built kernel
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: $OUT_DIR/arch/arm64/boot/Image.gz-dtb
